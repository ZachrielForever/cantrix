[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cantrix"
version = "0.0.1"
description = "Live-coding music environment for the terminal"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "sounddevice",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
cantrix = "cantrix.cli:main"

[tool.setuptools.packages.find]
include = ["cantrix*"]

[tool.ruff]
line-length = 88
